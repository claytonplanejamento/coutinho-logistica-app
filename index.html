<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08285b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Coutinho Logística">
  <title>Coutinho Logística</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #eef3f9; overflow: hidden; }
    #shell { width: 100%; height: 100dvh; position: relative; background: #fff; }
    #appFrame { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg,#08285b,#0f4a91); z-index: 5; transition: opacity .25s ease; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .brand { color: #fff; text-align: center; padding: 28px; }
    .logo { width: 74px; height: 74px; margin: 0 auto 16px; border-radius: 22px; background: #fff; color: #08285b; display: grid; place-items: center; font-weight: 900; font-size: 28px; box-shadow: 0 14px 34px rgba(0,0,0,.22); }
    .brand h1 { font-size: 22px; margin: 0 0 6px; }
    .brand p { margin: 0; opacity: .86; }
    #installBar { position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 8; display: none; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 18px; background: rgba(8,40,91,.96); color: #fff; box-shadow: 0 12px 34px rgba(0,0,0,.24); }
    #installBar.show { display: flex; }
    #installBar .copy { flex: 1; min-width: 0; }
    #installBar strong { display: block; font-size: 14px; }
    #installBar small { display: block; opacity: .82; margin-top: 2px; }
    #installBtn { border: 0; border-radius: 13px; padding: 10px 14px; font-weight: 800; background: #fff; color: #08285b; }
    #dismissBtn { border: 0; background: transparent; color: #fff; font-size: 20px; padding: 6px; }
    #errorBox { position: absolute; inset: 0; z-index: 9; display:none; place-items:center; background:#eef3f9; padding:24px; }
    #errorBox.show { display:grid; }
    .errorCard { max-width:440px; background:#fff; border-radius:22px; padding:24px; box-shadow:0 16px 42px rgba(13,39,80,.14); text-align:center; }
    .errorCard h2 { margin-top:0; color:#08285b; }
    .errorCard button { width:100%; border:0; border-radius:14px; padding:13px; background:#08285b; color:#fff; font-weight:800; }
  </style>
</head>
<body>
  <main id="shell">
    <div id="loading">
      <div class="brand">
        <div class="logo">CL</div>
        <h1>Coutinho Logística</h1>
        <p>Carregando Central Operacional...</p>
      </div>
    </div>

    <iframe
      id="appFrame"
      title="Coutinho Logística"
      src="https://script.google.com/macros/s/AKfycbw9_GypoVyYQ6qArmPOTsVXTBR1h4AoRwwwwjR4JCu4Gu3cj9TRDFtgEQX7UTaDPM3C/exec"
      allow="geolocation; camera; microphone; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <section id="installBar" aria-live="polite">
      <div class="copy">
        <strong>Instalar Coutinho Logística</strong>
        <small>Use como aplicativo na tela inicial.</small>
      </div>
      <button id="installBtn" type="button">INSTALAR</button>
      <button id="dismissBtn" type="button" aria-label="Fechar">×</button>
    </section>

    <div id="errorBox">
      <div class="errorCard">
        <h2>Não foi possível abrir o sistema</h2>
        <p>Verifique sua internet e tente novamente.</p>
        <button type="button" onclick="location.reload()">TENTAR NOVAMENTE</button>
      </div>
    </div>
  </main>

  <script>
    const frame = document.getElementById('appFrame');
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('errorBox');
    const installBar = document.getElementById('installBar');
    const installBtn = document.getElementById('installBtn');
    const dismissBtn = document.getElementById('dismissBtn');
    let deferredInstallPrompt = null;
    let loaded = false;

    frame.addEventListener('load', () => {
      loaded = true;
      loading.classList.add('hidden');
    });

    setTimeout(() => {
      if (!loaded) errorBox.classList.add('show');
    }, 25000);

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      if (!window.matchMedia('(display-mode: standalone)').matches) {
        installBar.classList.add('show');
      }
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installBar.classList.remove('show');
    });

    dismissBtn.addEventListener('click', () => installBar.classList.remove('show'));
    window.addEventListener('appinstalled', () => installBar.classList.remove('show'));

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
